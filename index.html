<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오만의 탑</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f0e6d4;
      --muted: #cbbba6;
      --panel: #120f0c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--panel);
      color: var(--ink);
      font-family: "Segoe UI", sans-serif;
    }

    main {
      position: relative;
      width: 100%;
      height: 100%;
    }

    header {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 2;
      max-width: min(640px, calc(100% - 200px));
      pointer-events: none;
      text-shadow: 0 2px 8px #000;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    #inventory {
      position: absolute;
      top: 196px;
      right: 16px;
      z-index: 2;
      width: 148px;
      border: 2px solid #3a3228;
      border-radius: 8px;
      background: rgba(22, 18, 14, 0.9);
      min-height: 160px;
      padding: 12px;
    }

    #inventory h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #inventory-empty {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    #inventory-item {
      display: grid;
      justify-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    #inventory-item.equipped {
      outline: 2px solid #e6c36a;
      border-radius: 6px;
    }

    #inventory-item[hidden] {
      display: none;
    }

    #sword-icon {
      width: 100px;
      height: 56px;
      image-rendering: pixelated;
      pointer-events: none;
    }

    #game {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      cursor: crosshair;
      background: #2a241e;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="game" aria-label="오만의 탑 1층"></canvas>
    <header>
      <h1 id="floor-title">오만의 탑 1층</h1>
      <p>좌클릭으로 이동한다. 보물상자, 계단, 떨어진 검은 가까이 가서 커서가 손 모양일 때 더블클릭한다. 인벤토리의 검은 더블클릭으로 장착한다.</p>
    </header>
    <section id="inventory" aria-label="인벤토리">
      <h2>인벤토리</h2>
      <p id="inventory-empty">비어 있음</p>
      <div id="inventory-item" hidden>
        <canvas id="sword-icon" width="100" height="56" aria-hidden="true"></canvas>
        <span>놋쇠검</span>
      </div>
    </section>
  </main>

  <script type="module" src="src/game/main.js?v=7"></script>

</body>
</html>
