<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrogance — 2D 탑뷰 RPG</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f0e6d4;
      --muted: #cbbba6;
      --panel: #120f0c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--panel);
      color: var(--ink);
      font-family: "Segoe UI", sans-serif;
    }

    main {
      position: relative;
      width: 100%;
      height: 100%;
    }

    header {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 2;
      max-width: min(640px, calc(100% - 200px));
      pointer-events: none;
      text-shadow: 0 2px 8px #000;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    #inventory {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 2;
      width: 148px;
      border: 2px solid #3a3228;
      border-radius: 8px;
      background: rgba(22, 18, 14, 0.9);
      min-height: 160px;
      padding: 12px;
    }

    #inventory h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #inventory-empty {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    #inventory-item {
      display: grid;
      justify-items: center;
      gap: 6px;
      font-size: 14px;
    }

    #inventory-item[hidden] {
      display: none;
    }

    #sword-icon {
      width: 100px;
      height: 56px;
      image-rendering: pixelated;
    }

    #game {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      cursor: crosshair;
      background: #2a241e;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="game" aria-label="낡은 탑 1층 바닥 위의 탑뷰 캐릭터와 보물상자"></canvas>
    <header>
      <h1>Arrogance</h1>
      <p>탑 1층. 좌클릭으로 이동하고, 보물상자를 클릭하면 놋쇠검이 떨어집니다. 떨어진 검을 더블클릭하면 인벤토리에 들어갑니다.</p>
    </header>
    <section id="inventory" aria-label="인벤토리">
      <h2>인벤토리</h2>
      <p id="inventory-empty">비어 있음</p>
      <div id="inventory-item" hidden>
        <canvas id="sword-icon" width="100" height="56" aria-hidden="true"></canvas>
        <span>놋쇠검</span>
      </div>
    </section>
  </main>

  <script>
    // 낡은 석판 크기, 이동 속도, 도착 판정 거리
    const TILE_SIZE = 64
    const MOVE_SPEED = 150
    const ARRIVE_DISTANCE = 3
    const STONE_COLORS = ['#3c342c', '#4a3f34', '#322c27', '#55483c', '#3a312b']

    // LPC 표준 칸 크기. 걷기 9프레임은 위, 왼쪽, 아래, 오른쪽 순으로 8~11행에 있다.
    const FRAME_SIZE = 64
    const SPRITE_SCALE = 2
    const WALK_FRAMES = 9
    const WALK_ROWS = { up: 8, left: 9, down: 10, right: 11 }
    const STEP_DISTANCE = 14
    const SPRITE_URL = 'src/character/player.png'
    const FOOT_OFFSET_X = 32
    const FOOT_OFFSET_Y = 58
    const DIRECTION_LABEL = { up: '위', left: '왼쪽', down: '아래', right: '오른쪽' }
    const CLICK_DELAY = 220

    // 필드 위 보물상자. 좌표는 상자 중심이다.
    const CHEST = { x: 300, y: 190, width: 72, height: 52 }

    // 걷기 아래 방향 첫 칸에 있는 놋쇠검만 잘라 바닥 아이템으로 쓴다.
    const SWORD_URL = 'src/item/weapon/Sword_brass.png'
    const SWORD_SOURCE = { x: 25, y: 686, width: 20, height: 11 }
    const SWORD_SCALE = 5
    const SWORD_NAME = '놋쇠검'

    // 화면 좌표를 캔버스 내부 좌표로 바꾼다.
    const toCanvasPoint = (canvas, event) => {
      const rect = canvas.getBoundingClientRect()
      return {
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height),
      }
    }

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value))

    // 타일 좌표로 늘 같은 흠집 패턴이 나오게 한다.
    const tileHash = (column, row) => {
      let value = column * 374761393 + row * 668265263
      value = (value ^ (value >> 13)) * 1274126177
      return (value ^ (value >> 16)) >>> 0
    }

    // 브라우저 크기만큼 낡은 탑 1층 석판 바닥을 깐다.
    const drawTowerFloor = (ctx, width, height) => {
      ctx.fillStyle = '#16130f'
      ctx.fillRect(0, 0, width, height)

      for (let y = 0; y < height; y += TILE_SIZE) {
        for (let x = 0; x < width; x += TILE_SIZE) {
          const column = Math.floor(x / TILE_SIZE)
          const row = Math.floor(y / TILE_SIZE)
          const tone = tileHash(column, row)
          const gap = 3
          ctx.fillStyle = STONE_COLORS[tone % STONE_COLORS.length]
          ctx.fillRect(x + gap, y + gap, TILE_SIZE - gap * 2, TILE_SIZE - gap * 2)

          ctx.fillStyle = 'rgba(112, 88, 62, 0.28)'
          ctx.fillRect(x + gap, y + gap, TILE_SIZE - gap * 2, 3)

          if (tone % 5 === 0) {
            ctx.strokeStyle = 'rgba(14, 11, 9, 0.75)'
            ctx.lineWidth = 1
            ctx.beginPath()
            ctx.moveTo(x + 14, y + 20)
            ctx.lineTo(x + 30, y + 42)
            ctx.lineTo(x + 48, y + 34)
            ctx.stroke()
          }

          if (tone % 7 === 0) {
            ctx.fillStyle = 'rgba(18, 14, 11, 0.4)'
            ctx.beginPath()
            ctx.ellipse(x + 42, y + 30, 9, 5, 0, 0, Math.PI * 2)
            ctx.fill()
          }
        }
      }

      const shade = ctx.createRadialGradient(
        width / 2,
        height / 2,
        Math.min(width, height) * 0.15,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.72,
      )
      shade.addColorStop(0, 'rgba(0, 0, 0, 0)')
      shade.addColorStop(1, 'rgba(8, 6, 5, 0.5)')
      ctx.fillStyle = shade
      ctx.fillRect(0, 0, width, height)
    }

    const swordDrawSize = () => ({
      width: SWORD_SOURCE.width * SWORD_SCALE,
      height: SWORD_SOURCE.height * SWORD_SCALE,
    })

    const containsPoint = (point, centerX, centerY, width, height) => (
      Math.abs(point.x - centerX) <= width / 2
      && Math.abs(point.y - centerY) <= height / 2
    )

    // 이동량이 큰 축을 LPC 4방향 중 하나로 고른다.
    const directionFromDelta = (dx, dy) => {
      if (Math.abs(dx) > Math.abs(dy)) {
        return dx < 0 ? 'left' : 'right'
      }
      return dy < 0 ? 'up' : 'down'
    }

    // 클릭 지점과 LPC 스프라이트의 현재 걷기 프레임을 그린다.
    const drawActor = (ctx, sprite, player, target, moving) => {
      if (moving) {
        ctx.strokeStyle = 'rgba(255, 248, 214, 0.85)'
        ctx.lineWidth = 2
        ctx.beginPath()
        ctx.arc(target.x, target.y, 8, 0, Math.PI * 2)
        ctx.stroke()
      }

      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)'
      ctx.beginPath()
      ctx.ellipse(player.x, player.y, 16, 6, 0, 0, Math.PI * 2)
      ctx.fill()

      const row = WALK_ROWS[player.direction]
      const size = FRAME_SIZE * SPRITE_SCALE
      ctx.imageSmoothingEnabled = false
      ctx.drawImage(
        sprite,
        player.frame * FRAME_SIZE,
        row * FRAME_SIZE,
        FRAME_SIZE,
        FRAME_SIZE,
        player.x - FOOT_OFFSET_X * SPRITE_SCALE,
        player.y - FOOT_OFFSET_Y * SPRITE_SCALE,
        size,
        size,
      )
    }

    // 닫힌 상자는 뚜껑이 덮여 있고, 열리면 안쪽과 젖혀진 뚜껑을 보여 준다.
    const drawChest = (ctx, chest) => {
      const left = chest.x - chest.width / 2
      const top = chest.y - chest.height / 2

      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)'
      ctx.beginPath()
      ctx.ellipse(chest.x, top + chest.height - 4, 30, 8, 0, 0, Math.PI * 2)
      ctx.fill()

      ctx.fillStyle = '#8a5a2b'
      ctx.fillRect(left, top + 20, chest.width, chest.height - 20)
      ctx.fillStyle = '#d4b06a'
      ctx.fillRect(left, top + 28, chest.width, 5)
      ctx.fillRect(left, top + chest.height - 10, chest.width, 5)
      ctx.fillStyle = '#f0d48a'
      ctx.fillRect(chest.x - 5, top + 34, 10, 10)

      if (!chest.open) {
        ctx.fillStyle = '#6b4424'
        ctx.fillRect(left, top, chest.width, 24)
        ctx.fillStyle = '#d4b06a'
        ctx.fillRect(left, top + 10, chest.width, 4)
        return
      }

      ctx.fillStyle = '#2a2118'
      ctx.fillRect(left + 6, top + 24, chest.width - 12, 16)
      ctx.fillStyle = '#6b4424'
      ctx.beginPath()
      ctx.moveTo(left, top + 20)
      ctx.lineTo(left + 10, top - 6)
      ctx.lineTo(left + chest.width - 10, top - 6)
      ctx.lineTo(left + chest.width, top + 20)
      ctx.fill()
      ctx.fillStyle = '#d4b06a'
      ctx.fillRect(left + 10, top + 2, chest.width - 20, 4)
    }

    const drawDroppedSword = (ctx, image, item) => {
      const size = swordDrawSize()
      ctx.imageSmoothingEnabled = false
      ctx.drawImage(
        image,
        SWORD_SOURCE.x,
        SWORD_SOURCE.y,
        SWORD_SOURCE.width,
        SWORD_SOURCE.height,
        item.x - size.width / 2,
        item.y - size.height / 2,
        size.width,
        size.height,
      )
      ctx.fillStyle = '#f4efe2'
      ctx.font = '14px sans-serif'
      ctx.textAlign = 'center'
      ctx.fillText(SWORD_NAME, item.x, item.y + size.height / 2 + 16)
    }

    const startGame = () => {
      try {
        const canvas = document.getElementById('game')
        if (!(canvas instanceof HTMLCanvasElement)) {
          throw new Error('캔버스를 찾을 수 없습니다.')
        }

        const ctx = canvas.getContext('2d')
        if (!ctx) {
          throw new Error('2D 컨텍스트를 만들 수 없습니다.')
        }

        // 캔버스 해상도를 브라우저 영역에 맞춰 맵을 늘린다.
        const fitCanvas = () => {
          const width = Math.max(480, Math.floor(canvas.clientWidth))
          const height = Math.max(320, Math.floor(canvas.clientHeight))
          if (canvas.width === width && canvas.height === height) {
            return false
          }
          canvas.width = width
          canvas.height = height
          return true
        }

        fitCanvas()

        const player = {
          x: canvas.width / 2,
          y: canvas.height / 2,
          direction: 'down',
          frame: 0,
          stepCarry: 0,
        }
        const target = { x: player.x, y: player.y }
        let moving = false
        let lastTime = 0
        let spriteReady = false
        let spriteFailed = false

        const sprite = new Image()
        sprite.addEventListener('load', () => {
          try {
            const minWidth = FRAME_SIZE * WALK_FRAMES
            const minHeight = FRAME_SIZE * (WALK_ROWS.right + 1)
            if (sprite.naturalWidth < minWidth || sprite.naturalHeight < minHeight) {
              throw new Error('LPC 스프라이트 크기가 걷기 동작보다 작습니다.')
            }
            spriteReady = true
            console.log(`[상태] 스프라이트 로드 | ${sprite.naturalWidth}x${sprite.naturalHeight}`)
          } catch (error) {
            spriteFailed = true
            console.error('스프라이트 검증 실패', error)
          }
        })
        sprite.addEventListener('error', () => {
          spriteFailed = true
          console.error('캐릭터 스프라이트 로드 실패', SPRITE_URL)
        })
        sprite.src = SPRITE_URL

        const chest = { ...CHEST, open: false }
        let droppedSword = null
        let swordReady = false
        const inventory = []
        let clickTimer = null

        const swordImage = new Image()
        swordImage.addEventListener('load', () => {
          try {
            const minWidth = SWORD_SOURCE.x + SWORD_SOURCE.width
            const minHeight = SWORD_SOURCE.y + SWORD_SOURCE.height
            if (swordImage.naturalWidth < minWidth || swordImage.naturalHeight < minHeight) {
              throw new Error('놋쇠검 이미지가 자를 영역보다 작습니다.')
            }
            swordReady = true
            console.log(`[상태] 놋쇠검 로드 | ${swordImage.naturalWidth}x${swordImage.naturalHeight}`)
          } catch (error) {
            console.error('놋쇠검 검증 실패', error)
          }
        })
        swordImage.addEventListener('error', () => {
          console.error('놋쇠검 이미지 로드 실패', SWORD_URL)
        })
        swordImage.src = SWORD_URL

        const emptyLabel = document.getElementById('inventory-empty')
        const inventoryItem = document.getElementById('inventory-item')
        const swordIcon = document.getElementById('sword-icon')

        // 인벤토리에 넣은 놋쇠검을 칸 안에 다시 그린다.
        const renderInventory = () => {
          try {
            const hasSword = inventory.some((item) => item.name === SWORD_NAME)
            if (!(emptyLabel instanceof HTMLElement) || !(inventoryItem instanceof HTMLElement)) {
              throw new Error('인벤토리 요소를 찾을 수 없습니다.')
            }
            emptyLabel.hidden = hasSword
            inventoryItem.hidden = !hasSword
            if (!hasSword || !(swordIcon instanceof HTMLCanvasElement)) {
              return
            }
            const iconCtx = swordIcon.getContext('2d')
            if (!iconCtx) {
              throw new Error('인벤토리 칸을 그릴 수 없습니다.')
            }
            iconCtx.clearRect(0, 0, swordIcon.width, swordIcon.height)
            iconCtx.imageSmoothingEnabled = false
            iconCtx.drawImage(
              swordImage,
              SWORD_SOURCE.x,
              SWORD_SOURCE.y,
              SWORD_SOURCE.width,
              SWORD_SOURCE.height,
              0,
              0,
              swordIcon.width,
              swordIcon.height,
            )
          } catch (error) {
            console.error('인벤토리 표시 실패', error)
          }
        }

        // 위치, 방향, 걷기 프레임, 이동 여부를 콘솔에 남긴다.
        const printStatus = (label) => {
          console.log(
            `[상태] ${label} | 위치 (${Math.round(player.x)}, ${Math.round(player.y)}) | 목적지 (${Math.round(target.x)}, ${Math.round(target.y)}) | 방향: ${DIRECTION_LABEL[player.direction]} | 프레임: ${player.frame} | 이동중: ${moving}`
          )
        }

        const stopWalking = () => {
          moving = false
          player.frame = 0
          player.stepCarry = 0
        }

        const update = (dt) => {
          if (!moving) {
            return
          }

          const dx = target.x - player.x
          const dy = target.y - player.y
          const distance = Math.hypot(dx, dy)

          if (distance <= ARRIVE_DISTANCE) {
            player.x = target.x
            player.y = target.y
            stopWalking()
            printStatus('도착')
            return
          }

          player.direction = directionFromDelta(dx, dy)
          const step = Math.min(MOVE_SPEED * dt, distance)
          player.x += (dx / distance) * step
          player.y += (dy / distance) * step

          // 이동 거리에 맞춰 걷기 프레임을 넘겨, 발걸음과 속도가 어긋나지 않게 한다.
          player.stepCarry += step
          const advances = Math.floor(player.stepCarry / STEP_DISTANCE)
          if (advances > 0) {
            player.frame = (player.frame + advances) % WALK_FRAMES
            player.stepCarry -= advances * STEP_DISTANCE
          }
        }

        const draw = () => {
          drawTowerFloor(ctx, canvas.width, canvas.height)
          drawChest(ctx, chest)
          if (droppedSword && swordReady) {
            drawDroppedSword(ctx, swordImage, droppedSword)
          }
          if (!spriteReady) {
            ctx.fillStyle = '#e8f0e4'
            ctx.font = '16px sans-serif'
            ctx.textAlign = 'left'
            ctx.fillText(spriteFailed ? '캐릭터 이미지를 불러오지 못했습니다.' : '캐릭터 이미지를 불러오는 중...', 24, 36)
            return
          }
          drawActor(ctx, sprite, player, target, moving)
        }

        const hitChest = (point) => containsPoint(point, chest.x, chest.y, chest.width, chest.height)

        const hitDroppedSword = (point) => {
          if (!droppedSword) {
            return false
          }
          const size = swordDrawSize()
          return containsPoint(point, droppedSword.x, droppedSword.y, size.width + 16, size.height + 28)
        }

        // 상자를 열면 놋쇠검을 상자 앞 바닥에 한 번만 떨어뜨린다.
        const openChest = () => {
          try {
            if (chest.open) {
              console.log('[상태] 이미 열린 보물상자')
              return
            }
            if (!swordReady) {
              throw new Error('놋쇠검 이미지를 아직 불러오지 못했습니다.')
            }
            const size = swordDrawSize()
            chest.open = true
            droppedSword = {
              x: chest.x,
              y: chest.y + chest.height / 2 + size.height / 2 + 18,
              name: SWORD_NAME,
            }
            console.log(`[상태] 보물상자 오픈 | ${SWORD_NAME}이 바닥에 떨어졌습니다.`)
          } catch (error) {
            console.error('보물상자 처리 실패', error)
          }
        }

        const storeSword = () => {
          try {
            if (!droppedSword) {
              return
            }
            inventory.push({ name: droppedSword.name })
            droppedSword = null
            renderInventory()
            console.log(`[상태] 인벤토리 저장 | ${SWORD_NAME} | 보유: ${inventory.length}`)
          } catch (error) {
            console.error('인벤토리 저장 실패', error)
          }
        }

        const beginMove = (point) => {
          const halfWidth = FOOT_OFFSET_X * SPRITE_SCALE
          const topMargin = FOOT_OFFSET_Y * SPRITE_SCALE
          const bottomMargin = (FRAME_SIZE - FOOT_OFFSET_Y) * SPRITE_SCALE
          target.x = clamp(point.x, halfWidth, canvas.width - halfWidth)
          target.y = clamp(point.y, topMargin, canvas.height - bottomMargin)

          const distance = Math.hypot(target.x - player.x, target.y - player.y)
          if (distance <= ARRIVE_DISTANCE) {
            stopWalking()
            printStatus('이미 그 위치')
            return
          }

          player.direction = directionFromDelta(target.x - player.x, target.y - player.y)
          moving = true
          printStatus('이동 시작')
        }

        canvas.addEventListener('click', (event) => {
          try {
            if (event.button !== 0) {
              return
            }

            const point = toCanvasPoint(canvas, event)
            if (hitChest(point)) {
              clearTimeout(clickTimer)
              openChest()
              return
            }

            clearTimeout(clickTimer)
            clickTimer = setTimeout(() => {
              try {
                beginMove(point)
              } catch (error) {
                console.error('이동 처리 실패', error)
              }
            }, CLICK_DELAY)
          } catch (error) {
            console.error('클릭 처리 실패', error)
          }
        })

        canvas.addEventListener('dblclick', (event) => {
          try {
            clearTimeout(clickTimer)
            const point = toCanvasPoint(canvas, event)
            if (hitDroppedSword(point)) {
              storeSword()
              return
            }
            if (hitChest(point)) {
              openChest()
              return
            }
            beginMove(point)
          } catch (error) {
            console.error('더블클릭 처리 실패', error)
          }
        })

        const loop = (now) => {
          try {
            const dt = lastTime === 0 ? 0 : Math.min((now - lastTime) / 1000, 0.05)
            lastTime = now
            update(dt)
            draw()
          } catch (error) {
            console.error('프레임 처리 실패', error)
          }
          requestAnimationFrame(loop)
        }

        const keepInside = (point) => {
          point.x = clamp(point.x, 48, Math.max(48, canvas.width - 48))
          point.y = clamp(point.y, 72, Math.max(72, canvas.height - 48))
        }

        window.addEventListener('resize', () => {
          try {
            if (!fitCanvas()) {
              return
            }
            keepInside(player)
            keepInside(target)
            keepInside(chest)
            if (droppedSword) {
              keepInside(droppedSword)
            }
          } catch (error) {
            console.error('화면 크기 조정 실패', error)
          }
        })

        printStatus('게임 시작')
        requestAnimationFrame(loop)
      } catch (error) {
        console.error('게임 시작 실패', error)
      }
    }

    startGame()
  </script>
</body>
</html>
